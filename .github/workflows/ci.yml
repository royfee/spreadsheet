name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, zip, xml, ctype, dom, fileinfo, iconv, simplexml, xmlreader, xmlwriter
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, zip, xml
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse
